<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futures Scalping Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; }
        .container { max-width: 1400px; margin: 0 auto; padding: 12px; height: 100vh; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
        .header h1 { font-size: 20px; color: #f1f5f9; }
        .balance { text-align: right; }
        .balance .label { font-size: 11px; color: #94a3b8; }
        .balance .amount { font-size: 22px; font-weight: bold; color: #22c55e; }
        .grid { display: grid; grid-template-columns: 1fr 320px; gap: 12px; flex: 1; min-height: 0; padding-top: 10px; }
        .card { background: #1e293b; border-radius: 12px; padding: 12px; border: 1px solid #334155; display: flex; flex-direction: column; }
        .card-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        #chart-container { flex: 1; min-height: 0; position: relative; }
        #priceChart { width: 100%; height: 100%; display: block; background: #0f172a; border-radius: 8px; }
        .right-panel { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
        .strategy-btn { padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: white; transition: all 0.2s; }
        .strategy-btn.active { background: #22c55e; }
        .strategy-btn.active:hover { background: #16a34a; }
        .strategy-btn.inactive { background: #64748b; }
        .strategy-btn.inactive:hover { background: #475569; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; }
        .stat-item { background: #0f172a; padding: 6px 10px; border-radius: 6px; text-align: center; }
        .stat-item .value { font-size: 16px; font-weight: bold; }
        .stat-item .value.green { color: #22c55e; }
        .stat-item .value.red { color: #ef4444; }
        .stat-item .value.yellow { color: #eab308; }
        .stat-item .label { font-size: 10px; color: #94a3b8; }
        .trades-table { flex: 1; overflow: hidden; }
        .trades-table .scroll { height: 100%; overflow-y: auto; }
        .trades-table table { width: 100%; font-size: 12px; border-collapse: collapse; }
        .trades-table th { text-align: left; padding: 4px 4px; color: #94a3b8; font-weight: 500; border-bottom: 1px solid #1e293b; position: sticky; top: 0; background: #1e293b; }
        .trades-table td { padding: 4px 4px; border-bottom: 1px solid #1e293b; }
        .badge { padding: 2px 6px; border-radius: 3px; font-size: 10px; }
        .badge.buy { background: #166534; color: #86efac; }
        .badge.sell { background: #7f1d1d; color: #fca5a5; }
        .profit-positive { color: #22c55e; }
        .profit-negative { color: #ef4444; }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <!-- Шапка -->
            <div class="header">
                <div>
                    <h1>📊 Scalping Bot</h1>
                    <div style="display:flex;gap:16px;font-size:12px;color:#94a3b8;margin-top:2px;">
                        <span id="rtsQuote">RTS: --</span>
                        <span id="siQuote">Si: --</span>
                    </div>
                </div>
                <div class="balance">
                    <div class="label">БАЛАНС</div>
                    <div class="amount" id="balanceDisplay">100 000 ₽</div>
                </div>
            </div>
            
            <!-- Основная сетка -->
            <div class="grid">
                <!-- График -->
                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
                        <div class="card-title">📈 ГРАФИК ЦЕН RTS</div>
                        <span style="font-size:10px;color:#64748b;" id="priceLabel">--</span>
                    </div>
                    <div id="chart-container" style="flex:1;min-height:0;position:relative;">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>
                
                <!-- Правая панель -->
                <div class="right-panel">
                    <!-- Управление -->
                    <div class="card" style="flex-shrink:0;">
                        <div class="card-title">⚡ УПРАВЛЕНИЕ</div>
                        <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                            <button id="rtsBtn" class="strategy-btn inactive" onclick="toggleStrategy('RTS')">▶ RTS</button>
                            <button id="siBtn" class="strategy-btn inactive" onclick="toggleStrategy('Si')">▶ Si</button>
                        </div>
                        <div id="strategyStatus" style="font-size:12px;color:#94a3b8;">⏸ Остановлены</div>
                    </div>
                    
                    <!-- Статистика -->
                    <div class="card" style="flex-shrink:0;">
                        <div class="card-title">📊 СТАТИСТИКА</div>
                        <div class="stats-grid">
                            <div class="stat-item"><div class="value" id="totalTrades">0</div><div class="label">Сделок</div></div>
                            <div class="stat-item"><div class="value green" id="winRate">0%</div><div class="label">Win Rate</div></div>
                            <div class="stat-item"><div class="value green" id="totalProfit">0 ₽</div><div class="label">Профит</div></div>
                            <div class="stat-item"><div class="value yellow" id="drawdown">0%</div><div class="label">Просадка</div></div>
                        </div>
                    </div>
                    
                    <!-- Сделки -->
                    <div class="card" style="flex:1;min-height:0;">
                        <div class="card-title">📋 ПОСЛЕДНИЕ СДЕЛКИ</div>
                        <div class="trades-table">
                            <div class="scroll">
                                <table>
                                    <thead><tr><th>Время</th><th>Инстр</th><th>Напр</th><th>Цена</th><th style="text-align:right;">P&L</th></tr></thead>
                                    <tbody id="tradesBody">
                                        <tr><td colspan="5" style="text-align:center;color:#475569;padding:12px 0;">Нет сделок</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        //  ТОРГОВЫЙ БОТ + ПРОСТОЙ ГРАФИК
        // ============================================
        
        // ---------- СОСТОЯНИЕ ----------
        const STATE = {
            balance: 100000,
            trades: [],
            strategies: { RTS: false, Si: false },
            quotes: { RTS: { price: 0, change: 0 }, Si: { price: 0, change: 0 } },
            positions: { RTS: null, Si: null },
            stats: { total: 0, wins: 0, losses: 0, profit: 0 },
            priceHistory: [],
            maxPoints: 100
        };

        // ---------- ГРАФИК ----------
        function drawPriceChart() {
            const canvas = document.getElementById('priceChart');
            if (!canvas) return;
            
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            
            const W = rect.width;
            const H = rect.height;
            const pad = { top: 20, bottom: 25, left: 50, right: 20 };
            const chartW = W - pad.left - pad.right;
            const chartH = H - pad.top - pad.bottom;
            
            // Очистка
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, W, H);
            
            const data = STATE.priceHistory;
            if (data.length < 2) {
                ctx.fillStyle = '#475569';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Загрузка данных...', W/2, H/2);
                return;
            }
            
            // Находим min/max
            const prices = data.map(d => d.price);
            let min = Math.min(...prices);
            let max = Math.max(...prices);
            const range = max - min || 1;
            
            // Добавляем отступы
            min -= range * 0.05;
            max += range * 0.05;
            const range2 = max - min || 1;
            
            // Рисуем сетку
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = pad.top + (i / 4) * chartH;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(W - pad.right, y);
                ctx.stroke();
                
                const price = max - (i / 4) * range2;
                ctx.fillStyle = '#64748b';
                ctx.font = '10px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(price.toFixed(2), pad.left - 5, y + 3);
            }
            
            // Рисуем линию цены
            ctx.beginPath();
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 2;
            
            data.forEach((d, i) => {
                const x = pad.left + (i / (data.length - 1)) * chartW;
                const y = pad.top + chartH - ((d.price - min) / range2) * chartH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Заливка под графиком
            const lastX = pad.left + chartW;
            const lastY = pad.top + chartH - ((data[data.length-1].price - min) / range2) * chartH;
            ctx.lineTo(lastX, pad.top + chartH);
            ctx.lineTo(pad.left, pad.top + chartH);
            ctx.closePath();
            ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
            ctx.fill();
            
            // Текущая цена
            const currentPrice = data[data.length-1].price;
            const currentY = pad.top + chartH - ((currentPrice - min) / range2) * chartH;
            ctx.fillStyle = '#22c55e';
            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(currentPrice.toFixed(2), pad.left + chartW - 60, currentY - 8);
            
            // Маркеры сделок
            STATE.trades.forEach(t => {
                const idx = data.findIndex(d => Math.abs(d.time - new Date(t.timestamp).getTime()) < 5000);
                if (idx === -1) return;
                
                const x = pad.left + (idx / (data.length - 1)) * chartW;
                const y = pad.top + chartH - ((t.price - min) / range2) * chartH;
                
                ctx.fillStyle = t.side === 'buy' ? '#22c55e' : '#ef4444';
                ctx.beginPath();
                if (t.side === 'buy') {
                    ctx.moveTo(x, y - 10);
                    ctx.lineTo(x - 5, y - 2);
                    ctx.lineTo(x + 5, y - 2);
                } else {
                    ctx.moveTo(x, y + 10);
                    ctx.lineTo(x - 5, y + 2);
                    ctx.lineTo(x + 5, y + 2);
                }
                ctx.closePath();
                ctx.fill();
            });
            
            // Подписи
            ctx.fillStyle = '#64748b';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'center';
            
            const times = data.map(d => new Date(d.time));
            const step = Math.max(1, Math.floor(data.length / 6));
            for (let i = 0; i < data.length; i += step) {
                const x = pad.left + (i / (data.length - 1)) * chartW;
                const t = times[i];
                ctx.fillText(t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0'), x, H - 5);
            }
        }

        // ---------- MOEX API ----------
        async function fetchQuote(instrument) {
            try {
                const sec = instrument === 'RTS' ? 'RTS-9.26' : 'Si-9.26';
                const url = `https://iss.moex.com/iss/engines/futures/markets/forts/boards/RFUD/securities/${sec}.json`;
                const resp = await fetch(url);
                const data = await resp.json();
                const row = data.marketdata.data[0];
                const cols = data.marketdata.columns;
                const price = row[cols.indexOf('LAST')] || 0;
                const open = row[cols.indexOf('OPEN')] || price;
                const change = open ? ((price - open) / open) * 100 : 0;
                return { price, change };
            } catch {
                return null;
            }
        }

        // ---------- ТОРГОВЛЯ ----------
        function executeTrade(instrument, side, price) {
            const pos = STATE.positions[instrument];
            
            if (side === 'buy') {
                if (pos) return;
                STATE.positions[instrument] = { side: 'buy', entry: price };
                return;
            }

            if (side === 'sell') {
                if (!pos) return;
                const profit = (price - pos.entry);
                STATE.balance += profit;
                const trade = {
                    id: Date.now(),
                    instrument,
                    side: pos.side === 'buy' ? 'sell' : 'buy',
                    price: Math.round(price * 100) / 100,
                    profit: Math.round(profit * 100) / 100,
                    timestamp: new Date().toISOString(),
                    timeStr: new Date().toLocaleTimeString()
                };
                STATE.trades.push(trade);
                STATE.positions[instrument] = null;
                STATE.stats.total++;
                if (profit > 0) STATE.stats.wins++; else STATE.stats.losses++;
                STATE.stats.profit += profit;
                render();
            }
        }

        // ---------- СТРАТЕГИИ ----------
        function runStrategies() {
            if (!STATE.strategies.RTS && !STATE.strategies.Si) return;

            const rts = STATE.quotes.RTS;
            const si = STATE.quotes.Si;

            if (STATE.strategies.RTS && rts.price > 0) {
                const pos = STATE.positions.RTS;
                if (!pos) {
                    executeTrade('RTS', 'buy', rts.price);
                } else {
                    const profit = rts.price - pos.entry;
                    if (profit >= 120 || profit <= -45) {
                        executeTrade('RTS', 'sell', rts.price);
                    }
                }
            }

            if (STATE.strategies.Si && si.price > 0) {
                const pos = STATE.positions.Si;
                if (!pos) {
                    if (si.price > 90) {
                        executeTrade('Si', 'buy', si.price);
                    }
                } else {
                    const profit = pos.entry - si.price;
                    if (profit >= 70 || profit <= -25) {
                        executeTrade('Si', 'sell', si.price);
                    }
                }
            }
        }

        // ---------- ОТРИСОВКА ----------
        function render() {
            const s = STATE.stats;
            const winRate = s.total ? Math.round((s.wins / s.total) * 100) : 0;
            const profit = Math.round(s.profit * 100) / 100;

            document.getElementById('balanceDisplay').textContent = Math.round(STATE.balance) + ' ₽';
            document.getElementById('rtsQuote').textContent = `RTS: ${STATE.quotes.RTS.price ? STATE.quotes.RTS.price.toFixed(2) : '--'}`;
            document.getElementById('siQuote').textContent = `Si: ${STATE.quotes.Si.price ? STATE.quotes.Si.price.toFixed(2) : '--'}`;

            document.getElementById('totalTrades').textContent = s.total;
            document.getElementById('winRate').textContent = winRate + '%';
            document.getElementById('totalProfit').textContent = (profit > 0 ? '+' : '') + profit + ' ₽';
            document.getElementById('totalProfit').className = 'value ' + (profit >= 0 ? 'green' : 'red');

            const rtsBtn = document.getElementById('rtsBtn');
            const siBtn = document.getElementById('siBtn');
            rtsBtn.textContent = (STATE.strategies.RTS ? '⏹' : '▶') + ' RTS';
            rtsBtn.className = 'strategy-btn ' + (STATE.strategies.RTS ? 'active' : 'inactive');
            siBtn.textContent = (STATE.strategies.Si ? '⏹' : '▶') + ' Si';
            siBtn.className = 'strategy-btn ' + (STATE.strategies.Si ? 'active' : 'inactive');
            document.getElementById('strategyStatus').textContent = 
                (STATE.strategies.RTS || STATE.strategies.Si) ? '🟢 Активны' : '⏸ Остановлены';

            const tbody = document.getElementById('tradesBody');
            const trades = STATE.trades.slice(-15).reverse();
            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#475569;padding:12px 0;">Нет сделок</td></tr>';
            } else {
                tbody.innerHTML = trades.map(t => `
                    <tr>
                        <td>${t.timeStr}</td>
                        <td>${t.instrument}</td>
                        <td><span class="badge ${t.side === 'buy' ? 'buy' : 'sell'}">${t.side === 'buy' ? 'Покуп' : 'Продаж'}</span></td>
                        <td>${t.price.toFixed(2)}</td>
                        <td style="text-align:right;font-weight:bold;" class="${t.profit >= 0 ? 'profit-positive' : 'profit-negative'}">${t.profit >= 0 ? '+' : ''}${t.profit}</td>
                    </tr>
                `).join('');
            }
            
            // Обновляем график
            drawPriceChart();
        }

        // ---------- УПРАВЛЕНИЕ ----------
        window.toggleStrategy = function(instrument) {
            STATE.strategies[instrument] = !STATE.strategies[instrument];
            render();
        };

        // ---------- ЦИКЛ ОБНОВЛЕНИЯ ----------
        async function updateAll() {
            try {
                const rts = await fetchQuote('RTS');
                if (rts && rts.price > 0) {
                    STATE.quotes.RTS = rts;
                    STATE.priceHistory.push({
                        time: Date.now(),
                        price: rts.price
                    });
                    if (STATE.priceHistory.length > STATE.maxPoints) {
                        STATE.priceHistory = STATE.priceHistory.slice(-STATE.maxPoints);
                    }
                }
                
                const si = await fetchQuote('Si');
                if (si) STATE.quotes.Si = si;
                
                runStrategies();
                render();
            } catch (e) {
                console.error('Ошибка обновления:', e);
            }
            
            setTimeout(updateAll, 2000);
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        document.addEventListener('DOMContentLoaded', () => {
            updateAll();
            window.addEventListener('resize', () => {
                drawPriceChart();
            });
        });
    </script>
</body>
</html>
