<!DOCTYPE html>.
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futures Scalping Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #111827; 
        color: #f3f4f6; 
        height: 100vh;
        overflow: hidden;
      }
      #root { height: 100vh; overflow: hidden; }
      .card { background: #1f2937; border-radius: 12px; padding: 1rem; border: 1px solid #374151; }
      .status-badge.active { background: #10b981; color: white; }
      .status-badge.inactive { background: #6b7280; color: white; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #1f2937; }
      ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ============================================================
      // ТОРГОВЫЙ БОТ — ВСЯ ЛОГИКА В ОДНОМ ФАЙЛЕ
      // ============================================================

      const DEMO_BALANCE = 100000;
      let balance = DEMO_BALANCE;
      let trades = [];
      let strategies = { RTS: false, Si: false };
      let quotes = { RTS: { price: 0, change: 0 }, Si: { price: 0, change: 0 } };
      let activePositions = { RTS: null, Si: null };
      let stats = { total: 0, wins: 0, losses: 0, profit: 0 };

      // ---------- MOEX API ----------
      async function fetchQuote(instrument) {
        try {
          const sec = instrument === 'RTS' ? 'RTS-9.26' : 'Si-9.26';
          const url = `https://iss.moex.com/iss/engines/futures/markets/forts/boards/RFUD/securities/${sec}.json`;
          const resp = await fetch(url);
          const data = await resp.json();
          const row = data.marketdata.data[0];
          const cols = data.marketdata.columns;
          const price = row[cols.indexOf('LAST')] || 0;
          const open = row[cols.indexOf('OPEN')] || price;
          const change = open ? ((price - open) / open) * 100 : 0;
          return { price, change };
        } catch {
          return null;
        }
      }

      async function updateQuotes() {
        const rts = await fetchQuote('RTS');
        const si = await fetchQuote('Si');
        if (rts) quotes.RTS = rts;
        if (si) quotes.Si = si;
        render();
      }

      // ---------- ДЕМО-СЧЁТ ----------
      function executeTrade(instrument, side, price) {
        const pos = activePositions[instrument];
        
        if (side === 'buy') {
          if (pos) return;
          activePositions[instrument] = { side: 'buy', entry: price };
          return;
        }

        if (side === 'sell') {
          if (!pos) return;
          const profit = (price - pos.entry) * 1; // 1 контракт
          balance += profit;
          trades.push({
            id: Date.now(),
            instrument,
            side: pos.side === 'buy' ? 'sell' : 'buy',
            price,
            profit: Math.round(profit * 100) / 100,
            timestamp: new Date().toLocaleTimeString()
          });
          activePositions[instrument] = null;
          stats.total++;
          if (profit > 0) stats.wins++; else stats.losses++;
          stats.profit += profit;
        }
        render();
      }

      // ---------- СТРАТЕГИИ ----------
      function runStrategies() {
        if (!strategies.RTS && !strategies.Si) return;

        const rts = quotes.RTS;
        const si = quotes.Si;

        // RTS — импульсный пробой
        if (strategies.RTS && rts.price > 0) {
          const pos = activePositions.RTS;
          if (!pos) {
            // Покупаем
            executeTrade('RTS', 'buy', rts.price);
          } else {
            // Проверяем тейк/стоп
            const profit = rts.price - pos.entry;
            if (profit >= 120 || profit <= -45) {
              executeTrade('RTS', 'sell', rts.price);
            }
          }
        }

        // Si — отскок от уровней
        if (strategies.Si && si.price > 0) {
          const pos = activePositions.Si;
          if (!pos) {
            // Продаём (имитация отскока)
            if (si.price > 90) {
              executeTrade('Si', 'buy', si.price);
            }
          } else {
            const profit = pos.entry - si.price;
            if (profit >= 70 || profit <= -25) {
              executeTrade('Si', 'sell', si.price);
            }
          }
        }
      }

      // ---------- ОТРИСОВКА ----------
      function render() {
        const container = document.getElementById('root');
        const rts = quotes.RTS;
        const si = quotes.Si;
        const totalTrades = trades.length;

        // Статистика
        const winRate = stats.total ? Math.round((stats.wins / stats.total) * 100) : 0;
        const profit = Math.round(stats.profit * 100) / 100;

        // Последние 10 сделок
        const lastTrades = trades.slice(-10).reverse();

        container.innerHTML = `
          <div class="h-screen p-4 flex flex-col overflow-hidden" style="background:#111827;">
            <!-- Верхняя панель -->
            <div class="flex justify-between items-center mb-3 flex-shrink-0">
              <div>
                <h1 class="text-2xl font-bold text-white">📊 Scalping Bot</h1>
                <span class="text-xs text-gray-400">Демо-счёт • ${new Date().toLocaleDateString()}</span>
              </div>
              <div class="text-right">
                <div class="text-sm text-gray-400">Баланс</div>
                <div class="text-2xl font-bold text-green-500">
                  ${Math.round(balance)} ₽
                  ${profit !== 0 ? `<span class="text-sm ml-2 ${profit > 0 ? 'text-green-400' : 'text-red-400'}">${profit > 0 ? '+' : ''}${profit} ₽</span>` : ''}
                </div>
              </div>
            </div>

            <!-- Основная сетка -->
            <div class="grid grid-cols-12 gap-3 flex-1 min-h-0">
              <!-- Левый столбец: котировки -->
              <div class="col-span-3 flex flex-col gap-3">
                <div class="card flex-1">
                  <div class="text-xs text-gray-400 mb-2">📈 КОТИРОВКИ</div>
                  ${['RTS', 'Si'].map(inst => {
                    const q = quotes[inst];
                    return `
                      <div class="flex justify-between items-center py-2 border-b border-gray-700 last:border-0">
                        <span class="text-sm font-semibold text-gray-300">${inst}</span>
                        <div class="text-right">
                          <div class="text-white font-mono">${q?.price ? q.price.toFixed(2) : '--'}</div>
                          <div class="text-xs ${q?.change && q.change > 0 ? 'text-green-400' : 'text-red-400'}">
                            ${q?.change ? `${q.change > 0 ? '+' : ''}${q.change.toFixed(2)}%` : '--'}
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                  <div class="mt-2 text-xs text-gray-500">Обновление: каждые 2с</div>
                </div>

                <!-- Стратегии -->
                <div class="card">
                  <div class="text-xs text-gray-400 mb-2">⚡ СТРАТЕГИИ</div>
                  ${['RTS', 'Si'].map(inst => `
                    <div class="flex items-center justify-between py-1">
                      <span class="text-sm text-gray-300">${inst}</span>
                      <div class="flex gap-1">
                        <button onclick="toggleStrategy('${inst}')" 
                          class="px-2 py-0.5 text-xs rounded ${strategies[inst] ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'} text-white">
                          ${strategies[inst] ? '⏹' : '▶️'}
                        </button>
                      </div>
                    </div>
                  `).join('')}
                  <div class="text-xs text-gray-500 mt-1">${strategies.RTS || strategies.Si ? '🟢 Активна' : '⏸ Остановлена'}</div>
                </div>
              </div>

              <!-- Средний столбец: статистика -->
              <div class="col-span-5 flex flex-col gap-3">
                <div class="grid grid-cols-4 gap-2 flex-shrink-0">
                  ${[
                    { label: 'Всего сделок', value: stats.total },
                    { label: 'Win Rate', value: `${winRate}%`, color: 'text-green-400' },
                    { label: 'Профит', value: `${profit} ₽`, color: profit >= 0 ? 'text-green-400' : 'text-red-400' },
                    { label: 'Просадка', value: '0%', color: 'text-yellow-400' }
                  ].map(s => `
                    <div class="card text-center p-2">
                      <div class="text-xs text-gray-400">${s.label}</div>
                      <div class="text-base font-bold ${s.color || 'text-white'}">${s.value}</div>
                    </div>
                  `).join('')}
                </div>

                <!-- График P&L -->
                <div class="card flex-1">
                  <div class="text-xs text-gray-400 mb-1">📉 P&L ТРЕНД</div>
                  <div class="h-full flex items-end space-x-0.5" style="min-height:60px;">
                    ${trades.slice(-30).map(t => {
                      const h = Math.min(Math.abs(t.profit || 0) / 100, 60);
                      return `<div class="flex-1 flex flex-col items-center">
                        <div class="w-full transition-all" style="height:${Math.max(h, 2)}px; background-color:${t.profit > 0 ? '#22c55e' : '#ef4444'}; min-height:2px;"></div>
                      </div>`;
                    }).join('') || '<div class="text-gray-500 text-sm w-full text-center">Нет сделок</div>'}
                  </div>
                  <div class="flex justify-between text-xs text-gray-500 mt-1">
                    <span>Последние 30 сделок</span>
                    <span>Прибыль: ${profit} ₽</span>
                  </div>
                </div>
              </div>

              <!-- Правый столбец: сделки -->
              <div class="col-span-4 card flex flex-col">
                <div class="text-xs text-gray-400 mb-2 flex-shrink-0">📋 ПОСЛЕДНИЕ СДЕЛКИ (${stats.total})</div>
                <div class="flex-1 overflow-hidden">
                  <div class="h-full overflow-y-auto" style="scrollbar-width:thin;">
                    <table class="w-full text-xs">
                      <thead class="text-gray-500 sticky top-0 bg-gray-800">
                        <tr><th class="text-left py-1">Время</th><th class="text-left py-1">Инстр</th><th class="text-left py-1">Напр</th><th class="text-left py-1">Цена</th><th class="text-right py-1">P&L</th></tr>
                      </thead>
                      <tbody>
                        ${lastTrades.map(t => `
                          <tr class="border-t border-gray-700">
                            <td class="py-1 text-gray-400">${t.timestamp}</td>
                            <td class="py-1 text-gray-300">${t.instrument}</td>
                            <td class="py-1"><span class="px-1.5 py-0.5 rounded text-xs ${t.side === 'buy' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}">${t.side === 'buy' ? 'Покуп' : 'Продаж'}</span></td>
                            <td class="py-1 text-gray-300">${t.price.toFixed(2)}</td>
                            <td class="py-1 text-right font-mono ${t.profit > 0 ? 'text-green-400' : t.profit < 0 ? 'text-red-400' : 'text-gray-400'}">${t.profit ? `${t.profit > 0 ? '+' : ''}${t.profit}` : '--'}</td>
                          </tr>
                        `).join('') || '<tr><td colspan="5" class="text-center text-gray-500 py-4">Нет сделок</td></tr>'}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // ---------- УПРАВЛЕНИЕ ----------
      window.toggleStrategy = function(instrument) {
        strategies[instrument] = !strategies[instrument];
        render();
      };

      // ---------- ЦИКЛ ОБНОВЛЕНИЯ ----------
      async function loop() {
        await updateQuotes();
        runStrategies();
        setTimeout(loop, 2000);
      }

      // ---------- СТАРТ ----------
      render();
      loop();
    </script>
  </body>
</html>
