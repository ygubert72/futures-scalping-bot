<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futures Scalping Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; }
        .container { max-width: 1500px; margin: 0 auto; padding: 10px; height: 100vh; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
        .header h1 { font-size: 18px; color: #f1f5f9; }
        .balance { text-align: right; }
        .balance .label { font-size: 10px; color: #94a3b8; }
        .balance .amount { font-size: 20px; font-weight: bold; color: #22c55e; }
        .grid { display: grid; grid-template-columns: 1fr 300px; gap: 10px; flex: 1; min-height: 0; padding-top: 8px; }
        .card { background: #1e293b; border-radius: 10px; padding: 10px; border: 1px solid #334155; display: flex; flex-direction: column; }
        .card-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
        #chart-container { flex: 1; min-height: 0; position: relative; overflow: hidden; }
        #candleChart { width: 100%; height: 100%; display: block; background: #0f172a; border-radius: 6px; cursor: grab; }
        #candleChart:active { cursor: grabbing; }
        .chart-controls { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; padding: 4px 0; align-items: center; }
        .chart-controls button { background: #334155; border: none; color: #94a3b8; padding: 2px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .chart-controls button:hover { background: #475569; color: #e2e8f0; }
        .chart-controls button.active { background: #22c55e; color: white; }
        .chart-controls .sep { color: #475569; font-size: 11px; margin: 0 2px; }
        .right-panel { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
        .strategy-btn { padding: 3px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; color: white; transition: all 0.2s; }
        .strategy-btn.active { background: #22c55e; }
        .strategy-btn.active:hover { background: #16a34a; }
        .strategy-btn.inactive { background: #64748b; }
        .strategy-btn.inactive:hover { background: #475569; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; flex-shrink: 0; }
        .stat-item { background: #0f172a; padding: 4px 8px; border-radius: 4px; text-align: center; }
        .stat-item .value { font-size: 14px; font-weight: bold; }
        .stat-item .value.green { color: #22c55e; }
        .stat-item .value.red { color: #ef4444; }
        .stat-item .value.yellow { color: #eab308; }
        .stat-item .label { font-size: 9px; color: #94a3b8; }
        .trades-table { flex: 1; overflow: hidden; }
        .trades-table .scroll { height: 100%; overflow-y: auto; }
        .trades-table table { width: 100%; font-size: 11px; border-collapse: collapse; }
        .trades-table th { text-align: left; padding: 3px 3px; color: #94a3b8; font-weight: 500; border-bottom: 1px solid #1e293b; position: sticky; top: 0; background: #1e293b; }
        .trades-table td { padding: 3px 3px; border-bottom: 1px solid #1e293b; }
        .badge { padding: 1px 5px; border-radius: 3px; font-size: 9px; }
        .badge.buy { background: #166534; color: #86efac; }
        .badge.sell { background: #7f1d1d; color: #fca5a5; }
        .profit-positive { color: #22c55e; }
        .profit-negative { color: #ef4444; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
        .zoom-info { font-size: 10px; color: #64748b; text-align: right; flex-shrink: 0; }
        .inst-btn { background: #334155; border: none; color: #94a3b8; padding: 2px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .inst-btn.active { background: #22c55e; color: white; }
        .inst-btn:hover { background: #475569; color: #e2e8f0; }
        .price-display { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .price-display .label { font-size: 10px; color: #64748b; }
        .price-display .price { font-size: 14px; font-weight: bold; color: #22c55e; font-family: monospace; }
        .price-display .change { font-size: 11px; }
        .price-display .change.positive { color: #22c55e; }
        .price-display .change.negative { color: #ef4444; }
        .export-btn { width:100%; padding:6px; background:#22c55e; color:white; border:none; border-radius:5px; font-size:12px; cursor:pointer; margin-top:6px; }
        .export-btn:hover { background:#16a34a; }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <div>
                    <h1>📊 Scalping Bot</h1>
                    <div style="display:flex;gap:14px;font-size:11px;color:#94a3b8;margin-top:1px;">
                        <span id="rtsQuote">RTS: --</span>
                        <span id="siQuote">Si: --</span>
                    </div>
                </div>
                <div class="balance">
                    <div class="label">БАЛАНС</div>
                    <div class="amount" id="balanceDisplay">100 000 ₽</div>
                </div>
            </div>
            
            <div class="grid">
                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;flex-wrap:wrap;gap:4px;">
                        <div class="card-title" id="chartTitle">📈 ГРАФИК RTS</div>
                        <div class="chart-controls" id="timeframeControls">
                            <button id="instRTS" class="inst-btn active" onclick="switchInstrument('RTS')">RTS</button>
                            <button id="instSi" class="inst-btn" onclick="switchInstrument('Si')">Si</button>
                            <span class="sep">|</span>
                            <button data-interval="1" class="active">1м</button>
                            <button data-interval="5">5м</button>
                            <button data-interval="15">15м</button>
                            <button data-interval="60">1ч</button>
                            <button data-interval="240">4ч</button>
                            <span class="sep">|</span>
                            <button id="zoomInV" title="Вертикальный зум +">🔍+</button>
                            <button id="zoomOutV" title="Вертикальный зум -">🔍−</button>
                            <button id="zoomResetV" title="Сбросить вертикальный зум">⟲</button>
                            <span class="sep">|</span>
                            <div class="price-display">
                                <span class="label">Текущая:</span>
                                <span class="price" id="currentPrice">--</span>
                                <span class="change" id="priceChange">--</span>
                            </div>
                        </div>
                    </div>
                    <div id="chart-container">
                        <canvas id="candleChart"></canvas>
                    </div>
                    <div style="display:flex;justify-content:space-between;flex-shrink:0;padding-top:4px;">
                        <div style="font-size:10px;color:#64748b;">
                            <span id="candleCount">0</span> свечей · 
                            <span id="timeframeLabel">1м</span>
                        </div>
                        <div class="zoom-info">
                            Колёсико: гор.масштаб | Ctrl+колёсико: верт.масштаб
                        </div>
                    </div>
                </div>
                
                <div class="right-panel">
                    <div class="card" style="flex-shrink:0;">
                        <div class="card-title">⚡ УПРАВЛЕНИЕ</div>
                        <div style="display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap;">
                            <button id="rtsBtn" class="strategy-btn inactive" onclick="toggleStrategy('RTS')">▶ RTS</button>
                            <button id="siBtn" class="strategy-btn inactive" onclick="toggleStrategy('Si')">▶ Si</button>
                        </div>
                        <div id="strategyStatus" style="font-size:11px;color:#94a3b8;">⏸ Остановлены</div>
                    </div>
                    
                    <div class="card" style="flex-shrink:0;">
                        <div class="card-title">📊 СТАТИСТИКА</div>
                        <div class="stats-grid">
                            <div class="stat-item"><div class="value" id="totalTrades">0</div><div class="label">Сделок</div></div>
                            <div class="stat-item"><div class="value green" id="winRate">0%</div><div class="label">Win Rate</div></div>
                            <div class="stat-item"><div class="value green" id="totalProfit">0 ₽</div><div class="label">Профит</div></div>
                            <div class="stat-item"><div class="value yellow" id="drawdown">0%</div><div class="label">Просадка</div></div>
                        </div>
                        <button id="exportBtn" class="export-btn">📥 Экспорт отчёта (Excel)</button>
                    </div>
                    
                    <div class="card" style="flex:1;min-height:0;">
                        <div class="card-title">📋 СДЕЛКИ</div>
                        <div class="trades-table">
                            <div class="scroll">
                                <table>
                                    <thead><tr><th>Время</th><th>Инстр</th><th>Напр</th><th>Цена</th><th style="text-align:right;">P&L</th></tr></thead>
                                    <tbody id="tradesBody">
                                        <tr><td colspan="5" style="text-align:center;color:#475569;padding:10px 0;">Нет сделок</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  АВТО-ОПРЕДЕЛЕНИЕ КОДОВ ИНСТРУМЕНТОВ
        // ============================================================
        const INSTRUMENT_CODES = { RTS: null, Si: null };

        async function detectInstrumentCodes() {
            try {
                const resp = await fetch('https://iss.moex.com/iss/engines/futures/markets/forts/boards/RFUD/securities.json');
                const data = await resp.json();
                const rows = data.securities?.data || [];
                const cols = data.securities?.columns || [];
                
                const secIdx = cols.indexOf('SECID');
                const nameIdx = cols.indexOf('SHORTNAME');
                const boardIdx = cols.indexOf('BOARDID');
                
                let rtsCodes = [], siCodes = [];
                
                rows.forEach(row => {
                    const board = row[boardIdx];
                    if (board !== 'RFUD') return;
                    
                    const secid = row[secIdx];
                    const name = row[nameIdx] || '';
                    
                    if (name.startsWith('RTS-') || name.startsWith('RTSM-')) {
                        rtsCodes.push({ secid, name });
                    }
                    if (name.startsWith('Si-') || name.startsWith('SiM-')) {
                        siCodes.push({ secid, name });
                    }
                });
                
                const sortByDate = (arr) => {
                    return arr.sort((a, b) => {
                        const dateA = a.name.match(/\d{2}\.\d{2}/)?.[0] || '99.99';
                        const dateB = b.name.match(/\d{2}\.\d{2}/)?.[0] || '99.99';
                        return dateA.localeCompare(dateB);
                    });
                };
                
                const sortedRTS = sortByDate(rtsCodes);
                const sortedSi = sortByDate(siCodes);
                
                if (sortedRTS.length > 0) {
                    INSTRUMENT_CODES.RTS = sortedRTS[0].secid;
                    console.log(`✅ Найден RTS: ${sortedRTS[0].name} (${INSTRUMENT_CODES.RTS})`);
                }
                if (sortedSi.length > 0) {
                    INSTRUMENT_CODES.Si = sortedSi[0].secid;
                    console.log(`✅ Найден Si: ${sortedSi[0].name} (${INSTRUMENT_CODES.Si})`);
                }
                
                if (!INSTRUMENT_CODES.RTS) {
                    INSTRUMENT_CODES.RTS = 'RIU6';
                    console.warn('⚠️ RTS не найден, используем запасной:', INSTRUMENT_CODES.RTS);
                }
                if (!INSTRUMENT_CODES.Si) {
                    INSTRUMENT_CODES.Si = 'SIU6';
                    console.warn('⚠️ Si не найден, используем запасной:', INSTRUMENT_CODES.Si);
                }
                
                return true;
            } catch (e) {
                console.warn('⚠️ Ошибка определения кодов:', e);
                INSTRUMENT_CODES.RTS = 'RIU6';
                INSTRUMENT_CODES.Si = 'SIU6';
                return true;
            }
        }

        // ============================================================
        //  СОСТОЯНИЕ
        // ============================================================
        const STATE = {
            balance: 100000,
            trades: [],
            strategies: { RTS: false, Si: false },
            quotes: { RTS: { price: 0, change: 0 }, Si: { price: 0, change: 0 } },
            positions: { RTS: null, Si: null },
            stats: { total: 0, wins: 0, losses: 0, profit: 0 },
            minuteCandles: { RTS: [], Si: [] },
            candles: { RTS: [], Si: [] },
            visibleCandles: [],
            interval: 1,
            visibleCount: 60,
            zoomLevel: 1,
            zoomMin: 0.03,
            zoomMax: 50,
            offset: 0,
            verticalZoom: 1,
            currentInstrument: 'RTS',
        };

        // ============================================================
        //  АДАПТИВНОЕ КОЛИЧЕСТВО СВЕЧЕЙ
        // ============================================================
        function getOptimalCandleCount() {
            const container = document.getElementById('chart-container');
            if (!container) return 60;
            const width = container.getBoundingClientRect().width;
            return Math.max(20, Math.floor(width / 12));
        }

        // ============================================================
        //  АГРЕГАЦИЯ СВЕЧЕЙ (1м → 5м, 15м, 1ч, 4ч)
        // ============================================================
        function aggregateCandles(minuteCandles, targetInterval) {
            if (!minuteCandles || minuteCandles.length === 0) return [];
            const result = [];
            const step = targetInterval;
            for (let i = 0; i < minuteCandles.length; i += step) {
                const group = minuteCandles.slice(i, i + step);
                if (group.length < step && i + step < minuteCandles.length) continue;
                result.push({
                    time: group[0].time,
                    open: group[0].open,
                    high: Math.max(...group.map(c => c.high)),
                    low: Math.min(...group.map(c => c.low)),
                    close: group[group.length - 1].close,
                });
            }
            return result;
        }

        // ============================================================
        //  ЗАГРУЗКА 1М ДАННЫХ
        // ============================================================
        async function fetchMinuteCandles(instrument) {
            try {
                const sec = INSTRUMENT_CODES[instrument];
                if (!sec) return null;
                
                const now = new Date();
                const from = new Date(now);
                from.setDate(from.getDate() - 30); // 30 дней
                
                const url = `https://iss.moex.com/iss/engines/futures/markets/forts/boards/RFUD/securities/${sec}/candles.json`;
                const params = new URLSearchParams({
                    from: from.toISOString().slice(0,16),
                    till: now.toISOString().slice(0,16),
                    interval: 1,
                });
                
                const resp = await fetch(`${url}?${params}`);
                const data = await resp.json();
                const candles = data.candles?.data || [];
                const cols = data.candles?.columns || [];
                
                if (candles.length === 0) return null;
                
                return candles.map(row => ({
                    time: new Date(row[cols.indexOf('begin')]).getTime(),
                    open: row[cols.indexOf('open')],
                    high: row[cols.indexOf('high')],
                    low: row[cols.indexOf('low')],
                    close: row[cols.indexOf('close')],
                }));
            } catch (e) {
                console.warn('MOEX ошибка:', e);
                return null;
            }
        }

        async function fetchQuote(instrument) {
            try {
                const sec = INSTRUMENT_CODES[instrument];
                if (!sec) return null;
                
                const url = `https://iss.moex.com/iss/engines/futures/markets/forts/boards/RFUD/securities/${sec}.json`;
                const resp = await fetch(url);
                const data = await resp.json();
                const row = data.marketdata?.data?.[0];
                const cols = data.marketdata?.columns || [];
                const price = row?.[cols.indexOf('LAST')] || 0;
                const open = row?.[cols.indexOf('OPEN')] || price;
                const change = open ? ((price - open) / open) * 100 : 0;
                return { price, change };
            } catch {
                return null;
            }
        }

        // ============================================================
        //  ПЕРЕКЛЮЧЕНИЕ ИНСТРУМЕНТОВ
        // ============================================================
        window.switchInstrument = async function(instrument) {
            STATE.currentInstrument = instrument;
            STATE.zoomLevel = 1;
            STATE.offset = 0;
            STATE.visibleCount = getOptimalCandleCount();
            
            document.getElementById('instRTS').className = 'inst-btn' + (instrument === 'RTS' ? ' active' : '');
            document.getElementById('instSi').className = 'inst-btn' + (instrument === 'Si' ? ' active' : '');
            document.getElementById('chartTitle').textContent = '📈 ГРАФИК ' + instrument;
            
            if (STATE.minuteCandles[instrument].length === 0) {
                await loadMinuteCandles(instrument);
            }
            updateCandlesForInterval();
            drawCandleChart();
        };

        // ============================================================
        //  ЗАГРУЗКА И ОБНОВЛЕНИЕ ДАННЫХ
        // ============================================================
        async function loadMinuteCandles(instrument = 'RTS') {
            const candles = await fetchMinuteCandles(instrument);
            if (candles && candles.length > 10) {
                STATE.minuteCandles[instrument] = candles;
                console.log(`✅ Загружено 1м свечей (${instrument}):`, candles.length);
            } else {
                const startPrice = instrument === 'RTS' ? 78000 : 88;
                STATE.minuteCandles[instrument] = generateTestCandles(200, startPrice, 1);
                console.log(`📊 Используются тестовые 1м свечи (${instrument})`);
            }
            updateCandlesForInterval();
            drawCandleChart();
        }

        function updateCandlesForInterval() {
            const inst = STATE.currentInstrument || 'RTS';
            const minuteCandles = STATE.minuteCandles[inst] || [];
            if (minuteCandles.length === 0) return;
            
            const interval = STATE.interval;
            if (interval === 1) {
                STATE.candles[inst] = minuteCandles;
            } else {
                STATE.candles[inst] = aggregateCandles(minuteCandles, interval);
            }
            console.log(`📊 Агрегировано ${STATE.candles[inst].length} свечей (${interval}м)`);
        }

        // ============================================================
        //  ТЕСТОВЫЕ ДАННЫЕ
        // ============================================================
        function generateTestCandles(count, startPrice, stepMinutes = 1) {
            const now = Date.now();
            const candles = [];
            let price = startPrice;
            const volMultiplier = Math.sqrt(stepMinutes / 5);
            for (let i = 0; i < count; i++) {
                const change = (Math.random() - 0.5) * 300 * volMultiplier * 2;
                const open = price;
                let close = price + change;
                if (close < 1000) close = 1000 + Math.random() * 100;
                const high = Math.max(open, close) + Math.random() * 80 * volMultiplier * 2;
                const low = Math.min(open, close) - Math.random() * 80 * volMultiplier * 2;
                candles.push({
                    time: now - (count - i) * stepMinutes * 60000,
                    open: Math.round(open * 100) / 100,
                    high: Math.round(high * 100) / 100,
                    low: Math.round(low * 100) / 100,
                    close: Math.round(close * 100) / 100
                });
                price = close;
            }
            return candles;
        }

        // ============================================================
        //  ГРАФИК (С ИСПРАВЛЕННЫМ ЗУМОМ И ДРАГОМ)
        // ============================================================
        let chartState = {
            isDragging: false,
            dragStartX: 0,
            dragStartOffset: 0,
        };

        function drawCandleChart() {
            const canvas = document.getElementById('candleChart');
            if (!canvas) return;
            
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            
            const W = rect.width;
            const H = rect.height;
            const pad = { top: 20, bottom: 25, left: 55, right: 20 };
            const chartW = W - pad.left - pad.right;
            const chartH = H - pad.top - pad.bottom;
            
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, W, H);
            
            const inst = STATE.currentInstrument || 'RTS';
            let candles = STATE.candles[inst] || [];
            if (candles.length === 0) {
                ctx.fillStyle = '#475569';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Загрузка данных...', W/2, H/2);
                return;
            }
            
            // ✅ ПРАВИЛЬНЫЙ РАСЧЁТ visibleCount
            let visibleCount = STATE.visibleCount;
            if (STATE.zoomLevel > 1) {
                visibleCount = Math.floor(STATE.visibleCount / STATE.zoomLevel);
            } else {
                visibleCount = Math.floor(STATE.visibleCount * STATE.zoomLevel);
            }
            visibleCount = Math.max(10, visibleCount);
            
            // ✅ ПРАВИЛЬНЫЙ РАСЧЁТ startIdx С УЧЁТОМ offset
            let startIdx = Math.max(0, candles.length - visibleCount - STATE.offset);
            let endIdx = Math.min(candles.length, startIdx + visibleCount);
            
            if (endIdx - startIdx < 2) {
                startIdx = Math.max(0, candles.length - visibleCount);
                endIdx = candles.length;
            }
            
            const visible = candles.slice(startIdx, endIdx);
            STATE.visibleCandles = visible;
            
            if (visible.length < 2) {
                ctx.fillStyle = '#475569';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Недостаточно данных', W/2, H/2);
                return;
            }
            
            let min = Infinity, max = -Infinity;
            visible.forEach(c => {
                if (c.low < min) min = c.low;
                if (c.high > max) max = c.high;
            });
            
            const range = max - min || 1;
            const minRange = inst === 'RTS' ? 2 : 0.05;
            const finalRange = Math.max(range, minRange);
            const center = (max + min) / 2;
            const halfRange = finalRange * 0.55;
            
            min = center - halfRange;
            max = center + halfRange;
            
            const verticalZoom = STATE.verticalZoom || 1;
            const zoomedRange = (max - min) / verticalZoom;
            const zoomCenter = (max + min) / 2;
            min = zoomCenter - zoomedRange / 2;
            max = zoomCenter + zoomedRange / 2;
            
            const padding = (max - min) * 0.05;
            min -= padding;
            max += padding;
            
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = pad.top + (i / 4) * chartH;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(W - pad.right, y);
                ctx.stroke();
                
                const price = max - (i / 4) * (max - min);
                ctx.fillStyle = '#64748b';
                ctx.font = '10px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(price.toFixed(2), pad.left - 5, y + 3);
            }
            
            const candleWidth = Math.max(2, Math.min((chartW / visible.length) * 0.7, 20));
            const gap = Math.max(0.5, (chartW / visible.length) - candleWidth);
            
            visible.forEach((c, i) => {
                const x = pad.left + (i / visible.length) * chartW + gap/2;
                const yHigh = pad.top + chartH - ((c.high - min) / (max - min)) * chartH;
                const yLow = pad.top + chartH - ((c.low - min) / (max - min)) * chartH;
                const yOpen = pad.top + chartH - ((c.open - min) / (max - min)) * chartH;
                const yClose = pad.top + chartH - ((c.close - min) / (max - min)) * chartH;
                
                const isGreen = c.close >= c.open;
                ctx.fillStyle = isGreen ? '#22c55e' : '#ef4444';
                ctx.strokeStyle = isGreen ? '#22c55e' : '#ef4444';
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                ctx.moveTo(x + candleWidth/2, yHigh);
                ctx.lineTo(x + candleWidth/2, yLow);
                ctx.stroke();
                
                const bodyY = Math.min(yOpen, yClose);
                const bodyH = Math.max(Math.abs(yClose - yOpen), 1);
                ctx.fillRect(x, bodyY, candleWidth, bodyH);
            });
            
            STATE.trades.forEach(t => {
                if (t.instrument !== inst) return;
                
                const tTime = new Date(t.timestamp).getTime();
                let candleIdx = -1;
                let minDiff = Infinity;
                
                visible.forEach((c, i) => {
                    const diff = Math.abs(c.time - tTime);
                    if (diff < minDiff) {
                        minDiff = diff;
                        candleIdx = i;
                    }
                });
                
                if (candleIdx === -1 || minDiff > 60000) return;
                
                const c = visible[candleIdx];
                const x = pad.left + (candleIdx / visible.length) * chartW + candleWidth/2;
                const y = pad.top + chartH - ((c.close - min) / (max - min)) * chartH;
                
                ctx.fillStyle = t.side === 'buy' ? '#22c55e' : '#ef4444';
                ctx.beginPath();
                if (t.side === 'buy') {
                    ctx.moveTo(x, y - 14);
                    ctx.lineTo(x - 7, y - 4);
                    ctx.lineTo(x + 7, y - 4);
                } else {
                    ctx.moveTo(x, y + 14);
                    ctx.lineTo(x - 7, y + 4);
                    ctx.lineTo(x + 7, y + 4);
                }
                ctx.closePath();
                ctx.fill();
            });
            
            if (visible.length > 0) {
                const last = visible[visible.length-1];
                const lastY = pad.top + chartH - ((last.close - min) / (max - min)) * chartH;
                ctx.fillStyle = '#22c55e';
                ctx.font = '11px monospace';
                ctx.textAlign = 'left';
                ctx.fillText(last.close.toFixed(2), pad.left + chartW - 60, lastY - 8);
            }
            
            ctx.fillStyle = '#64748b';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'center';
            
            const step = Math.max(1, Math.floor(visible.length / 8));
            for (let i = 0; i < visible.length; i += step) {
                const x = pad.left + (i / visible.length) * chartW + candleWidth/2;
                const t = new Date(visible[i].time);
                const label = t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0');
                ctx.fillText(label, x, H - 5);
            }
            
            document.getElementById('candleCount').textContent = visible.length;
            document.getElementById('timeframeLabel').textContent = 
                STATE.interval < 60 ? STATE.interval + 'м' : (STATE.interval/60) + 'ч';
        }

        // ============================================================
        //  УПРАВЛЕНИЕ ГРАФИКОМ
        // ============================================================
        function setupChartControls() {
            const canvas = document.getElementById('candleChart');
            if (!canvas) return;
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                if (e.ctrlKey || e.metaKey) {
                    const delta = e.deltaY > 0 ? -0.1 : 0.1;
                    STATE.verticalZoom = Math.max(0.2, Math.min(10, (STATE.verticalZoom || 1) + delta));
                    drawCandleChart();
                } else {
                    const delta = e.deltaY > 0 ? -0.15 : 0.15;
                    STATE.zoomLevel = Math.max(STATE.zoomMin, Math.min(STATE.zoomMax, STATE.zoomLevel + delta));
                    drawCandleChart();
                }
            }, { passive: false });
            
            canvas.addEventListener('mousedown', (e) => {
                chartState.isDragging = true;
                chartState.dragStartX = e.clientX;
                chartState.dragStartOffset = STATE.offset;
                canvas.style.cursor = 'grabbing';
            });
            
            window.addEventListener('mousemove', (e) => {
                if (!chartState.isDragging) return;
                const dx = e.clientX - chartState.dragStartX;
                const dragOffset = Math.round(dx / 3);
                STATE.offset = Math.max(0, chartState.dragStartOffset - dragOffset);
                drawCandleChart();
            });
            
            window.addEventListener('mouseup', () => {
                if (chartState.isDragging) {
                    chartState.isDragging = false;
                    canvas.style.cursor = 'grab';
                }
            });
            
            document.querySelectorAll('#timeframeControls button[data-interval]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#timeframeControls button[data-interval]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    STATE.interval = parseInt(btn.dataset.interval);
                    STATE.zoomLevel = 1;
                    STATE.verticalZoom = 1;
                    STATE.offset = 0;
                    STATE.visibleCount = getOptimalCandleCount();
                    updateCandlesForInterval();
                    drawCandleChart();
                });
            });
            
            document.getElementById('zoomInV').addEventListener('click', () => {
                STATE.verticalZoom = Math.min(10, (STATE.verticalZoom || 1) + 0.25);
                drawCandleChart();
            });
            document.getElementById('zoomOutV').addEventListener('click', () => {
                STATE.verticalZoom = Math.max(0.2, (STATE.verticalZoom || 1) - 0.25);
                drawCandleChart();
            });
            document.getElementById('zoomResetV').addEventListener('click', () => {
                STATE.verticalZoom = 1;
                drawCandleChart();
            });
        }

        // ============================================================
        //  ТОРГОВЛЯ
        // ============================================================
        function executeTrade(instrument, side, price) {
            const pos = STATE.positions[instrument];
            
            if (side === 'buy') {
                if (pos) return;
                STATE.positions[instrument] = { side: 'buy', entry: price };
                return;
            }

            if (side === 'sell') {
                if (!pos) return;
                const profit = (price - pos.entry);
                STATE.balance += profit;
                const trade = {
                    id: Date.now(),
                    instrument,
                    side: pos.side === 'buy' ? 'sell' : 'buy',
                    price: Math.round(price * 100) / 100,
                    profit: Math.round(profit * 100) / 100,
                    timestamp: new Date().toISOString(),
                    timeStr: new Date().toLocaleTimeString()
                };
                STATE.trades.push(trade);
                STATE.positions[instrument] = null;
                STATE.stats.total++;
                if (profit > 0) STATE.stats.wins++; else STATE.stats.losses++;
                STATE.stats.profit += profit;
                render();
            }
        }

        function runStrategies() {
            if (!STATE.strategies.RTS && !STATE.strategies.Si) return;

            const rts = STATE.quotes.RTS;
            const si = STATE.quotes.Si;
            const minuteData = STATE.minuteCandles;

            if (STATE.strategies.RTS && rts.price > 0) {
                const pos = STATE.positions.RTS;
                const candles = minuteData.RTS || [];
                if (!pos) {
                    const high = candles.slice(-20).reduce((a,b) => a.high > b.high ? a : b)?.high || rts.price;
                    const low = candles.slice(-20).reduce((a,b) => a.low < b.low ? a : b)?.low || rts.price;
                    if (rts.price > high) {
                        executeTrade('RTS', 'buy', rts.price);
                    } else if (rts.price < low) {
                        executeTrade('RTS', 'sell', rts.price);
                    }
                } else {
                    const profit = pos.side === 'buy' ? rts.price - pos.entry : pos.entry - rts.price;
                    if (profit >= 120 || profit <= -45) {
                        executeTrade('RTS', 'sell', rts.price);
                    }
                }
            }

            if (STATE.strategies.Si && si.price > 0) {
                const pos = STATE.positions.Si;
                const candles = minuteData.Si || [];
                if (!pos) {
                    const avg = candles.slice(-20).reduce((a,b) => a + b.close, 0) / (candles.slice(-20).length || 1) || si.price;
                    if (si.price < avg * 0.995) {
                        executeTrade('Si', 'buy', si.price);
                    } else if (si.price > avg * 1.005) {
                        executeTrade('Si', 'sell', si.price);
                    }
                } else {
                    const profit = pos.side === 'buy' ? si.price - pos.entry : pos.entry - si.price;
                    if (profit >= 70 || profit <= -25) {
                        executeTrade('Si', 'sell', si.price);
                    }
                }
            }
        }

        // ============================================================
        //  ОТРИСОВКА
        // ============================================================
        function render() {
            const s = STATE.stats;
            const winRate = s.total ? Math.round((s.wins / s.total) * 100) : 0;
            const profit = Math.round(s.profit * 100) / 100;

            document.getElementById('balanceDisplay').textContent = Math.round(STATE.balance) + ' ₽';
            document.getElementById('rtsQuote').textContent = `RTS: ${STATE.quotes.RTS.price ? STATE.quotes.RTS.price.toFixed(2) : '--'}`;
            document.getElementById('siQuote').textContent = `Si: ${STATE.quotes.Si.price ? STATE.quotes.Si.price.toFixed(2) : '--'}`;

            document.getElementById('totalTrades').textContent = s.total;
            document.getElementById('winRate').textContent = winRate + '%';
            document.getElementById('totalProfit').textContent = (profit > 0 ? '+' : '') + profit + ' ₽';
            document.getElementById('totalProfit').className = 'value ' + (profit >= 0 ? 'green' : 'red');

            const rtsBtn = document.getElementById('rtsBtn');
            const siBtn = document.getElementById('siBtn');
            rtsBtn.textContent = (STATE.strategies.RTS ? '⏹' : '▶') + ' RTS';
            rtsBtn.className = 'strategy-btn ' + (STATE.strategies.RTS ? 'active' : 'inactive');
            siBtn.textContent = (STATE.strategies.Si ? '⏹' : '▶') + ' Si';
            siBtn.className = 'strategy-btn ' + (STATE.strategies.Si ? 'active' : 'inactive');
            document.getElementById('strategyStatus').textContent = 
                (STATE.strategies.RTS || STATE.strategies.Si) ? '🟢 Активны' : '⏸ Остановлены';

            const tbody = document.getElementById('tradesBody');
            const trades = STATE.trades.slice(-15).reverse();
            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#475569;padding:10px 0;">Нет сделок</td></tr>';
            } else {
                tbody.innerHTML = trades.map(t => `
                    <tr>
                        <td>${t.timeStr}</td>
                        <td>${t.instrument}</td>
                        <td><span class="badge ${t.side === 'buy' ? 'buy' : 'sell'}">${t.side === 'buy' ? 'Покуп' : 'Продаж'}</span></td>
                        <td>${t.price.toFixed(2)}</td>
                        <td style="text-align:right;font-weight:bold;" class="${t.profit >= 0 ? 'profit-positive' : 'profit-negative'}">${t.profit >= 0 ? '+' : ''}${t.profit}</td>
                    </tr>
                `).join('');
            }
            
            const inst = STATE.currentInstrument || 'RTS';
            const quote = STATE.quotes[inst];
            if (quote && quote.price > 0) {
                document.getElementById('currentPrice').textContent = quote.price.toFixed(2);
                const change = quote.change || 0;
                const changeEl = document.getElementById('priceChange');
                changeEl.textContent = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
                changeEl.className = 'change ' + (change >= 0 ? 'positive' : 'negative');
            } else {
                document.getElementById('currentPrice').textContent = '--';
                document.getElementById('priceChange').textContent = '--';
                document.getElementById('priceChange').className = 'change';
            }
            
            drawCandleChart();
        }

        window.toggleStrategy = function(instrument) {
            STATE.strategies[instrument] = !STATE.strategies[instrument];
            render();
        };

        // ============================================================
        //  ЭКСПОРТ В EXCEL
        // ============================================================
        async function exportToExcel() {
            try {
                if (typeof XLSX === 'undefined') {
                    await loadScript('https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js');
                }

                const s = STATE.stats;
                const winRate = s.total ? Math.round((s.wins / s.total) * 100) : 0;
                const profit = Math.round(s.profit * 100) / 100;
                const total = s.total || 0;

                const statsData = [
                    ['ПОКАЗАТЕЛЬ', 'ЗНАЧЕНИЕ'],
                    ['Дата отчёта', new Date().toLocaleString()],
                    ['Инструмент', STATE.currentInstrument || 'RTS/Si'],
                    ['Начальный баланс', 100000],
                    ['Текущий баланс', Math.round(STATE.balance)],
                    ['Общий профит', profit],
                    ['Всего сделок', total],
                    ['Прибыльных сделок', s.wins],
                    ['Убыточных сделок', s.losses],
                    ['Win Rate (%)', winRate],
                    ['Средний профит', total > 0 ? (s.wins > 0 ? (s.profit / s.wins).toFixed(2) : 0) : 0],
                    ['Средний убыток', total > 0 ? (s.losses > 0 ? (Math.abs(s.profit) / s.losses).toFixed(2) : 0) : 0],
                    ['Профит-фактор', total > 0 ? (s.wins / (s.losses || 1)).toFixed(2) : 0],
                ];

                const tradesData = [
                    ['№', 'Время', 'Инструмент', 'Направление', 'Цена', 'P&L (₽)']
                ];
                STATE.trades.forEach((t, i) => {
                    tradesData.push([
                        i + 1,
                        t.timeStr || new Date(t.timestamp).toLocaleTimeString(),
                        t.instrument || 'RTS',
                        t.side === 'buy' ? 'Покупка' : 'Продажа',
                        t.price || '--',
                        t.profit || 0
                    ]);
                });

                const strategyData = [
                    ['ПАРАМЕТР', 'RTS', 'Si'],
                    ['Тип стратегии', 'Импульсный пробой', 'Отскок от уровней'],
                    ['Тейк-профит', '120 пунктов', '70 пунктов'],
                    ['Стоп-лосс', '45 пунктов', '25 пунктов'],
                    ['Активна', STATE.strategies.RTS ? '✅' : '❌', STATE.strategies.Si ? '✅' : '❌'],
                ];

                const wb = XLSX.utils.book_new();
                const ws1 = XLSX.utils.aoa_to_sheet(statsData);
                const ws2 = XLSX.utils.aoa_to_sheet(tradesData);
                const ws3 = XLSX.utils.aoa_to_sheet(strategyData);

                ws1['!cols'] = [{ wch: 25 }, { wch: 20 }];
                ws2['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 14 }];
                ws3['!cols'] = [{ wch: 25 }, { wch: 20 }, { wch: 20 }];

                XLSX.utils.book_append_sheet(wb, ws1, 'Статистика');
                XLSX.utils.book_append_sheet(wb, ws2, 'Сделки');
                XLSX.utils.book_append_sheet(wb, ws3, 'Стратегии');

                const filename = `trading_report_${new Date().toISOString().slice(0,10)}.xlsx`;
                XLSX.writeFile(wb, filename);
                
                console.log(`✅ Отчёт сохранён: ${filename}`);
                
            } catch (e) {
                console.error('❌ Ошибка экспорта:', e);
                alert('Ошибка экспорта. Проверьте интернет и попробуйте снова.');
            }
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // ============================================================
        //  ЦИКЛ ОБНОВЛЕНИЯ
        // ============================================================
        async function updateAll() {
            try {
                const inst = STATE.currentInstrument || 'RTS';
                
                const rts = await fetchQuote('RTS');
                if (rts && rts.price > 0) STATE.quotes.RTS = rts;
                
                const si = await fetchQuote('Si');
                if (si) STATE.quotes.Si = si;
                
                const minuteCandles = STATE.minuteCandles[inst];
                if (minuteCandles.length > 0 && STATE.quotes[inst]?.price > 0) {
                    const last = minuteCandles[minuteCandles.length-1];
                    const now = Date.now();
                    if (last && now - last.time > 120000) {
                        const newCandle = {
                            time: now - (now % 60000),
                            open: STATE.quotes[inst].price,
                            high: STATE.quotes[inst].price,
                            low: STATE.quotes[inst].price,
                            close: STATE.quotes[inst].price,
                        };
                        minuteCandles.push(newCandle);
                        if (minuteCandles.length > 2000) {
                            STATE.minuteCandles[inst] = minuteCandles.slice(-1500);
                        }
                    } else if (last) {
                        last.close = STATE.quotes[inst].price;
                        if (last.close > last.high) last.high = last.close;
                        if (last.close < last.low) last.low = last.close;
                    }
                    updateCandlesForInterval();
                }
                
                runStrategies();
                render();
            } catch (e) {
                console.error('Ошибка обновления:', e);
            }
            
            setTimeout(updateAll, 2000);
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            STATE.visibleCount = getOptimalCandleCount();
            STATE.zoomLevel = 1;
            
            console.log('🔍 Определение актуальных фьючерсов...');
            await detectInstrumentCodes();
            
            console.log('📊 Используемые коды:', INSTRUMENT_CODES);
            
            setupChartControls();
            
            await loadMinuteCandles('RTS');
            
            const rts = await fetchQuote('RTS');
            if (rts) STATE.quotes.RTS = rts;
            const si = await fetchQuote('Si');
            if (si) STATE.quotes.Si = si;
            
            updateAll();
            
            document.getElementById('exportBtn').addEventListener('click', exportToExcel);
            
            window.addEventListener('resize', () => {
                STATE.visibleCount = getOptimalCandleCount();
                drawCandleChart();
            });
        });
    </script>
